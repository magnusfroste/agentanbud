<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Agentanbud{% endblock %} — Svenska upphandlingar</title>

  <!-- SEO -->
  <meta name="description" content="Agentanbud — fri tillgång till svenska offentliga upphandlingar. Sök, bevaka och utforska upphandlingar från Mercell, TED EU och fler källor. Öppet API, MCP för AI-agenter. Infrastruktur för demokrati." />
  <meta name="keywords" content="upphandling, offentlig upphandling, Sverige, anbud, offentlig, Mercell, TED, LOU, direktupphandling, ramavtal, CPV, upphandlingsmyndigheten, fri data, öppen data" />
  <meta name="author" content="Agentanbud" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.agentanbud.se/" />

  <!-- OpenGraph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Agentanbud — Svenska upphandlingar, öppna för alla" />
  <meta property="og:description" content="Fri tillgång till svenska offentliga upphandlingar. Sök, bevaka och bygg ovanpå med öppet API och MCP. Infrastruktur för demokrati." />
  <meta property="og:url" content="https://www.agentanbud.se/" />
  <meta property="og:site_name" content="Agentanbud" />
  <meta property="og:locale" content="sv_SE" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Agentanbud — Svenska upphandlingar, öppna för alla" />
  <meta name="twitter:description" content="Fri tillgång till svenska offentliga upphandlingar. Öppet API + MCP för AI-agenter." />

  <!-- AEO (Answer Engine Optimization) — för AI-crawlers -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Agentanbud",
    "description": "Fri tillgång till svenska offentliga upphandlingar. Sök, bevaka och bygg ovanpå med öppet API och MCP.",
    "url": "https://www.agentanbud.se/",
    "applicationCategory": "GovernmentApplication",
    "operatingSystem": "Web",
    "offers": {"@type": "Offer", "price": "0", "priceCurrency": "SEK"},
    "license": "https://opensource.org/licenses/MIT",
    "keywords": ["upphandling", "offentlig upphandling", "Sverige", "anbud", "Mercell", "TED EU", "CPV", "LOU"],
    "inLanguage": "sv"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Vad är Agentanbud?",
        "acceptedAnswer": {"@type": "Answer", "text": "Agentanbud är en öppen spegel av svenska offentliga upphandlingar. Vi samlar data från Mercell, TED EU och andra källor i en SQLite-databas och serverar den via webb, REST API och MCP för AI-agenter."}
      },
      {
        "@type": "Question",
        "name": "Är Agentanbud gratis?",
        "acceptedAnswer": {"@type": "Answer", "text": "Ja. Hela API:t är öppet — inga konton, inga API-nycklar, inga betalväggar. Att söka är alltid gratis. För vissa upphandlingar behöver du skapa konto hos plattformen (Mercell, Tendsign, etc.) för att komma åt anbudsformulär och dokument."}
      },
      {
        "@type": "Question",
        "name": "Vilka datakällor använder Agentanbud?",
        "acceptedAnswer": {"@type": "Answer", "text": "Mercell (publikt sök-API, ~65-70% av svensk volym) och TED EU (EU-tröskelvärden). Vi respekterar robots.txt — e-Avrop är inte speglad eftersom de blockerar crawling."}
      },
      {
        "@type": "Question",
        "name": "Kan AI-agenter använda Agentanbud?",
        "acceptedAnswer": {"@type": "Answer", "text": "Ja. Agentanbud har en MCP-server med 16 öppna läsverktyg (search_tenders, get_tender, similar_tenders, deadline_calendar, get_stats, list_providers, list_regions, list_cpv_top, get_authority, match_profile, get_winner_history, search_knowledge, get_knowledge, list_posts, get_post, get_post_stats) plus 2 nyckel-skyddade skrivverktyg för bloggen (create_post, update_post) som låter Claude Code, Claude Cowork, Codex, Google Antigravity, Cursor och andra MCP-klienter söka, läsa och publicera direkt via https://www.agentanbud.se/mcp."}
      },
      {
        "@type": "Question",
        "name": "Hur ofta uppdateras datan?",
        "acceptedAnswer": {"@type": "Answer", "text": "Datan synkas automatiskt varje dag kl 06:00 UTC från alla källor."}
      }
    ]
  }
  </script>

  <!-- Favicon (inline SVG, Swedish flag) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 12'%3E%3Crect width='16' height='12' fill='%23006aa7'/%3E%3Crect y='4' width='16' height='4' fill='%23fecc00'/%3E%3Crect x='5' width='4' height='12' fill='%23fecc00'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="/static/style.css" />
  <script defer src="/static/app.js"></script>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Hoppa till innehåll</a>
  <header class="site">
    <div class="inner">
      <a href="/" class="brand">
        <span class="dot"></span>
        <span>Agentanbud</span>
     </a>
      <nav>
        <a href="/" class="{% set p=request.url.path if request else '' %}{% if p == '/' %}active{% endif %}">Hem</a>
        <a href="/browse" class="{% set p=request.url.path if request else '' %}{% if p.startswith('/browse') or p.startswith('/tenders') %}active{% endif %}">Browse</a>
        <a href="/dashboard" class="{% set p=request.url.path if request else '' %}{% if p.startswith('/dashboard') %}active{% endif %}">Insikter</a>
        <a href="/providers" class="{% set p=request.url.path if request else '' %}{% if p.startswith('/providers') %}active{% endif %}">Providers</a>
        <a href="/agenter" class="{% set p=request.url.path if request else '' %}{% if p.startswith('/agenter') %}active{% endif %}">Agenter</a>
        <a href="/blogg" class="{% set p=request.url.path if request else '' %}{% if p.startswith('/blogg') %}active{% endif %}">Blogg</a>
        <a href="/kunskap" class="{% set p=request.url.path if request else '' %}{% if p.startswith('/kunskap') %}active{% endif %}">Kunskap</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Växla mörkt/ljust läge" title="Mörkt/ljust läge">◐</button>
     </nav>
   </div>
 </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="inner">
      <span class="muted">Agentanbud — öppen data för svensk upphandling.</span>
      <span class="footer-links">
        <a href="https://github.com/magnusfroste/agentanbud" target="_blank" rel="noopener">GitHub</a>
        <a href="https://github.com/magnusfroste/agentanbud/blob/main/MCP.md" target="_blank" rel="noopener">MCP</a>
        <a href="/api/health">API</a>
        <a href="/system" class="muted">Driftstatus</a>
      </span>
    </div>
  </footer>
</body>
</html>
