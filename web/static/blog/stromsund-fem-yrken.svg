<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img"
     aria-label="Stromsunds kommun delade underhallet i fem separata upphandlingar - bygg, el, VVS, ventilation och maleri - i stallet for en generalentreprenad. Alla stanger 31 augusti.">
  <title>Fem yrken, fem egna tavlingar</title>
  <rect width="1200" height="500" rx="16" fill="#fcfcfb"/>
<text x="72" y="58" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="27" font-weight="600" fill="#0b0b0b" text-anchor="start">Fem yrken, fem egna tävlingar</text>
<text x="72" y="90" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="start">Strömsunds kommun delade underhållet per yrke i stället för en generalentreprenad</text>
  <rect x="72" y="150" width="250" height="150" rx="10" fill="#e6e5e2"/>
<text x="197" y="225" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#52514e" text-anchor="middle">En generalentreprenad</text>
<text x="197" y="252" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">— kräver storföretag</text>
<text x="360" y="232" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="start">i stället:</text>
  <rect x="470" y="150" width="122" height="150" rx="10" fill="#2a78d6" opacity="0.10"/>
  <rect x="470" y="150" width="122" height="5" rx="2" fill="#2a78d6"/>
<text x="531" y="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="600" fill="#0b0b0b" text-anchor="middle">Bygg</text>
<text x="531" y="245" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">#177691</text>
  <rect x="602" y="150" width="122" height="150" rx="10" fill="#2a78d6" opacity="0.10"/>
  <rect x="602" y="150" width="122" height="5" rx="2" fill="#2a78d6"/>
<text x="663" y="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="600" fill="#0b0b0b" text-anchor="middle">El</text>
<text x="663" y="245" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">#177690</text>
  <rect x="734" y="150" width="122" height="150" rx="10" fill="#2a78d6" opacity="0.10"/>
  <rect x="734" y="150" width="122" height="5" rx="2" fill="#2a78d6"/>
<text x="795" y="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="600" fill="#0b0b0b" text-anchor="middle">VVS</text>
<text x="795" y="245" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">#177687</text>
  <rect x="866" y="150" width="122" height="150" rx="10" fill="#2a78d6" opacity="0.10"/>
  <rect x="866" y="150" width="122" height="5" rx="2" fill="#2a78d6"/>
<text x="927" y="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="600" fill="#0b0b0b" text-anchor="middle">Ventilation</text>
<text x="927" y="245" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">#177688</text>
  <rect x="998" y="150" width="122" height="150" rx="10" fill="#2a78d6" opacity="0.10"/>
  <rect x="998" y="150" width="122" height="5" rx="2" fill="#2a78d6"/>
<text x="1059" y="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="600" fill="#0b0b0b" text-anchor="middle">Måleri</text>
<text x="1059" y="245" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">#177689</text>
<text x="72" y="362" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" font-weight="600" fill="#0b0b0b" text-anchor="start">Alla fem stänger 31 augusti.</text>
<text x="72" y="398" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Ett måleriföretag konkurrerar mot andra måleriföretag — inte mot en generalentreprenör.</text>
<text x="72" y="474" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Källa: agentanbud.se — Strömsunds kommun, publicerat via Mercell.</text>
</svg>
