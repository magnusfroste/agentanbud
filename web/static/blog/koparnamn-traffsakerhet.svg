<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img"
     aria-label="Andel av ortens upphandlingar dar koparen heter kommun, region eller stad: Halmstad 89 procent, Lulea och Orebro 73, Visby 69, Umea 66, men Goteborg 20, Malmo 19 och Stockholm 13.">
  <title>Samma sokning, helt olika traffsakerhet</title>
  <rect width="1200" height="640" rx="16" fill="#fcfcfb"/>
<text x="72" y="58" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="27" font-weight="600" fill="#0b0b0b" text-anchor="start">Samma sökning, helt olika träffsäkerhet</text>
<text x="72" y="90" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="start">Andel av ortens upphandlingar där köparen heter ”kommun”, ”region” eller ”stad”</text>
<text x="72" y="222" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="118" font-weight="700" fill="#b04a3a" text-anchor="start" letter-spacing="-4">13 %</text>
<text x="72" y="268" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">i Stockholm — mot 89 %</text>
<text x="72" y="296" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">i Halmstad</text>
<text x="72" y="332" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">Storstäder upphandlar genom bolag</text>
<text x="72" y="356" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">och förvaltningar: Locum, SISAB,</text>
<text x="72" y="380" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">Trafikkontoret. Ingen heter kommun.</text>
<text x="520" y="170" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">Halmstad</text>
  <rect x="690" y="152" width="250" height="25" rx="4" fill="#2a78d6"/>
<text x="954" y="171" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">89 %</text>
<text x="1128" y="171" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="end">147 annonser</text>
<text x="520" y="212" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">Luleå</text>
  <rect x="690" y="194" width="205" height="25" rx="4" fill="#2a78d6"/>
<text x="909" y="213" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">73 %</text>
<text x="1128" y="213" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="end">113 annonser</text>
<text x="520" y="254" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">Örebro</text>
  <rect x="690" y="236" width="205" height="25" rx="4" fill="#2a78d6"/>
<text x="909" y="255" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">73 %</text>
<text x="1128" y="255" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="end">151 annonser</text>
<text x="520" y="296" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">Visby</text>
  <rect x="690" y="278" width="194" height="25" rx="4" fill="#2a78d6"/>
<text x="898" y="297" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">69 %</text>
<text x="1128" y="297" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="end">62 annonser</text>
<text x="520" y="338" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">Umeå</text>
  <rect x="690" y="320" width="185" height="25" rx="4" fill="#2a78d6"/>
<text x="889" y="339" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">66 %</text>
<text x="1128" y="339" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="end">138 annonser</text>
<text x="520" y="380" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">Göteborg</text>
  <rect x="690" y="362" width="56" height="25" rx="4" fill="#b04a3a"/>
<text x="760" y="381" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">20 %</text>
<text x="1128" y="381" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="end">400 annonser</text>
<text x="520" y="422" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">Malmö</text>
  <rect x="690" y="404" width="53" height="25" rx="4" fill="#b04a3a"/>
<text x="757" y="423" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">19 %</text>
<text x="1128" y="423" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="end">232 annonser</text>
<text x="520" y="464" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">Stockholm</text>
  <rect x="690" y="446" width="37" height="25" rx="4" fill="#b04a3a"/>
<text x="741" y="465" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">13 %</text>
<text x="1128" y="465" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="end">1133 annonser</text>
  <rect x="72" y="510" width="1056" height="1" fill="#e6e5e2"/>
<text x="72" y="548" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="400" fill="#0b0b0b" text-anchor="start">En karta byggd på det här filtret visar var köpare heter ”kommun” —</text>
<text x="72" y="574" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="400" fill="#0b0b0b" text-anchor="start">inte var det upphandlas. Skillnaden är fyra till fem gånger.</text>
<text x="72" y="610" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Källa: agentanbud.se — TED. Öppna upphandlingar och förhandsannonser per köparort.</text>
</svg>
