<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img"
     aria-label="Av Trafikverkets 315 leverantorer har 208 vunnit exakt en gang, 66 procent. De tre storsta star for 111 av 784 vinster, 14 procent.">
  <title>Gar det att vinna mot de stora?</title>
  <rect width="1200" height="500" rx="16" fill="#fcfcfb"/>
<text x="72" y="58" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="27" font-weight="600" fill="#0b0b0b" text-anchor="start">Går det att vinna mot de stora?</text>
<text x="72" y="90" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="start">Trafikverkets 539 tilldelningar, fördelade på 315 leverantörer</text>
<text x="72" y="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="112" font-weight="700" fill="#2a78d6" text-anchor="start" letter-spacing="-4">66 %</text>
<text x="72" y="262" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">av leverantörerna har</text>
<text x="72" y="290" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">vunnit exakt en gång</text>
<text x="72" y="322" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">208 av 315 — marknaden</text>
<text x="72" y="346" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">har en lång svans.</text>
<text x="560" y="170" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">SWECO Sverige AB</text>
  <rect x="760" y="152" width="250" height="25" rx="4" fill="#2a78d6"/>
<text x="1024" y="171" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">46</text>
<text x="560" y="212" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">Norconsult Sverige AB</text>
  <rect x="760" y="194" width="201" height="25" rx="4" fill="#2a78d6"/>
<text x="975" y="213" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">37</text>
<text x="560" y="254" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">WSP Sverige AB</text>
  <rect x="760" y="236" width="152" height="25" rx="4" fill="#2a78d6"/>
<text x="926" y="255" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">28</text>
<text x="560" y="296" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">Tyréns Sverige AB</text>
  <rect x="760" y="278" width="136" height="25" rx="4" fill="#2a78d6"/>
<text x="910" y="297" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">25</text>
<text x="560" y="338" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">AFRY Infrastructure AB</text>
  <rect x="760" y="320" width="130" height="25" rx="4" fill="#2a78d6"/>
<text x="904" y="339" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">24</text>
<text x="560" y="380" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start">Svevia AB</text>
  <rect x="760" y="362" width="103" height="25" rx="4" fill="#2a78d6"/>
<text x="877" y="381" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">19</text>
  <rect x="72" y="398" width="1056" height="1" fill="#e6e5e2"/>
<text x="72" y="436" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="400" fill="#0b0b0b" text-anchor="start">De tre största står tillsammans för 111 av 784 vinster — 14 procent.</text>
<text x="72" y="462" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="400" fill="#0b0b0b" text-anchor="start">Resten delas av 312 andra leverantörer.</text>
<text x="72" y="489" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Källa: agentanbud.se — tilldelningar från TED. Samma tilldelning räknas en gång.</text>
</svg>
