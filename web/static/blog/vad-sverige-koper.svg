<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"
     aria-label="Sex av 21 386 offentliga upphandlingar som en AI-agent valde ut: sjukhusclowner i Region Östergötland, får mot jätteloka i Solna, kostymer till Säkerhetspolisen, skrotbilar till räddningstjänstens övningar, omhändertagande av kameldjur i Halland och julbelysning i Stockholm för 2026 till 2032.">
  <title>Vad Sverige köper när ingen tittar</title>
  <rect width="1200" height="560" rx="16" fill="#fcfcfb"/>
<text x="72.0" y="58.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="27" font-weight="600" fill="#0b0b0b" text-anchor="start">Vad Sverige köper när ingen tittar</text>
