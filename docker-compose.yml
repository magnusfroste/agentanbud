#
# docker-compose.yml — Agentanbud on Easypanel
#
# One container: FastAPI serves dashboard + API, cron triggers scrapers.
# SQLite + sync logs persist in /data (mounted as a Docker volume).
# Traefik (managed by Easypanel) terminates HTTPS for us.
#
# IMPORTANT: We use `expose:` instead of `ports:` so Easypanel's auto-generated
# override doesn't try to bind 127.0.0.1:8080 on the host (which is often
# already taken by Traefik itself or a previous container). Traefik reaches
# the container via the Docker network using container port 8080 directly.
#
services:
  app:
    build: .
    expose:
      - "8080"
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/application.db
      - USER_AGENT=${USER_AGENT:-agentanbud/0.1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Admin auth — when set, mutating endpoints require X-Admin-Key
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      # Local development only: opens write endpoints when no key is set.
      # Leave unset in production — writes fail closed without a key.
      - ALLOW_OPEN_ADMIN=${ALLOW_OPEN_ADMIN:-}
      # Schedule for the in-container cron (any valid crontab expression)
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 6 * * *}
      # Scraper toggles — set to "false" to skip a source
      - SCRAPE_MERCELL=${SCRAPE_MERCELL:-true}
      - SCRAPE_TED=${SCRAPE_TED:-true}
      - SCRAPE_TED_AWARDS=${SCRAPE_TED_AWARDS:-true}
      - SCRAPE_TED_PIN=${SCRAPE_TED_PIN:-true}
      - SCRAPE_LOV=${SCRAPE_LOV:-true}
      - SCRAPE_KOMMERSANNONS=${SCRAPE_KOMMERSANNONS:-true}
      - SCRAPE_CRITERIA=${SCRAPE_CRITERIA:-true}
      - SCRAPE_QUESTIONS=${SCRAPE_QUESTIONS:-true}
      - SCRAPE_UHM_CONTRACTS=${SCRAPE_UHM_CONTRACTS:-true}
      - SCRAPE_UHM_NOTICES=${SCRAPE_UHM_NOTICES:-true}
      - SCRAPE_SYNONYMS=${SCRAPE_SYNONYMS:-true}
      # Synonyms learned at night (scraper/synonyms.py): an OpenAI-compatible
      # API. Off unless all three are set. The key lives only in Easypanel.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_SYNONYMS_MODE=${LLM_SYNONYMS_MODE:-suggest}
      - LLM_SYNONYMS_PER_NIGHT=${LLM_SYNONYMS_PER_NIGHT:-15}
    restart: unless-stopped
